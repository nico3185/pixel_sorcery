# ROM-free checks on every push and pull request (roadmap 0.1.2): the engine builds with no warning
# on macOS, Linux and Windows, and the self-checks that need no game pass. Games are never built
# here: their C is generated from the player's own ROM.
# Runs on the public repo only (Actions are free there; every export is checked). The private repo would
# pay for runner minutes (macOS 10x, Windows 2x): there, engine/tools/ci_local.sh runs the same checks.
name: ci
on:
  push:                 # main and the release tags; a branch is checked once, by its pull request
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:    # windows-package again for a tag (input tag)
    inputs:
      tag: { description: 'release tag (v0.7.5)', required: true }
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]   # macos-14: GitHub stopped allocating it ("not supported")
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true              # Genesis Plus GX: the reference build and the runtime test
      - name: dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install sdl2 ninja; else
            sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev zlib1g-dev ninja-build; fi
          python3 -m venv .venv && .venv/bin/pip install --quiet capstone   # Homebrew's Python is externally managed
      - name: engine (warnings are errors)
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
          cmake --build build
      - name: self-checks
        run: |
          ctest --test-dir build --output-on-failure
          .venv/bin/python engine/tools/recompiler/test_analyze.py
      - name: one executable for several titles (Ultimate SH's build, two stand-in titles with the same names)
        run: |
          cmake -S engine/tools/ultimate -B build-u -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror \
            -DULTIMATE_GAMES_DIR=$PWD/engine/tools/ultimate/tests "-DULTIMATE_TITLES=ta;tb"
          cmake --build build-u --target ultimate_sh
          r=0; ./build-u/ultimate_sh --game ta x || r=$?; test $r = 1
          r=0; ./build-u/ultimate_sh --game tb x || r=$?; test $r = 2
          ./build-u/ultimate_sh --list
  windows:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4      # no submodule: the native-only build the Windows download ships
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-zlib mingw-w64-x86_64-python
            mingw-w64-x86_64-python-capstone
      - name: engine, native only (warnings are errors)
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
          cmake --build build
      - name: self-checks
        run: |
          ctest --test-dir build --output-on-failure   # native-only: the instruction edge cases
          python engine/tools/recompiler/test_analyze.py
      - name: one executable for several titles (Ultimate SH's build, two stand-in titles with the same names)
        run: |
          cmake -S engine/tools/ultimate -B build-u -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror \
            -DULTIMATE_GAMES_DIR=$PWD/engine/tools/ultimate/tests "-DULTIMATE_TITLES=ta;tb"
          cmake --build build-u --target ultimate_sh
          r=0; ./build-u/ultimate_sh.exe --game ta x || r=$?; test $r = 1
          r=0; ./build-u/ultimate_sh.exe --game tb x || r=$?; test $r = 2
          ./build-u/ultimate_sh.exe --list
  # the Windows download for a release (the zip and the single-file exe, make_zip.sh), built on Windows and
  # attached to the tag's GitHub release: a release made on a Mac gets its Windows files without a Windows PC
  windows-package:
    if: ${{ !github.event.repository.private && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true              # the core's cycle table for m68k_cycles.txt (the core itself is left out)
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit            # powershell (the icon) and gh from Windows
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-python-capstone
            mingw-w64-x86_64-binutils zip zsh git
      - name: package
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python -m venv --system-site-packages engine/.venv
          zsh ./engine/tools/windows/make_zip.sh --version "${tag#v}" build/win
          ls -l build/win
      - name: attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload $tag (Get-ChildItem build/win/* | ForEach-Object FullName) --clobber -R $env:GITHUB_REPOSITORY
